<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Cambie el título: es el texto de la pestaña del navegador
        y el que aparece en los resultados de búsqueda. -->
    <title>
        Contacto con Luis Carlos Contreras
    </title>
    <meta name="description" content="Esta es la página web de Luis Carlos Contreras.">

    <!-- Las tipografías van ANTES de la hoja de estilos, en las tres páginas. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playwrite+CU+Guides:wght@400&display=swap">

    <!-- La hoja de estilos se trabaja a partir de la sesión 3. -->
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/scripts.js" defer></script>
</head>

<body>
    <header>
        <h1>Contacto con Luis Carlos Contreras</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="contacto.html">Contacto</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contacto</h2>
            <p>Formulario de contacto</p>

            <!-- novalidate apaga los avisos del navegador para que se vean
                 los mensajes propios, que son los que se escribieron aquí. -->
            <form id="contacto" novalidate>
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">
                    <p class="error" id="error-nombre"></p>
                </div>

                <div>
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo">
                    <p class="error" id="error-correo"></p>
                </div>

                <div>
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5"></textarea>
                    <p class="error" id="error-mensaje"></p>
                </div>

                <button type="submit">Enviar</button>
            </form>

            <!-- Va vacío. El texto lo escribe JavaScript cuando todo está bien.
                 role="status" hace que un lector de pantalla lo anuncie. -->
            <p class="exito oculto" id="mensaje-exito" role="status"></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="anio"></span> Luis Carlos Contreras</p>
    </footer>
</body>

</html>
